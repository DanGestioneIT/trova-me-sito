name: Pubblica su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un solo deploy alla volta; se ne arrivano due, vince l'ultimo.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  compila:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Compila il sito
        run: npm run build

      - name: Verifica il sito compilato
        run: node --test "tests/**/*.test.mjs"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  pubblica:
    needs: compila
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
